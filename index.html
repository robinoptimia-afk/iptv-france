<title>IPTV France</title>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface2: #334155;
    --accent: #3b82f6;
    --accent-glow: rgba(59,130,246,0.3);
    --text: #f1f5f9;
    --text2: #94a3b8;
    --radius: 14px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    overflow-x: hidden;
  }

  /* ── PLAYER ── */
  #player-section {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #000;
    width: 100%;
    aspect-ratio: 16/9;
    max-height: 35dvh;
    display: none;
    flex-direction: column;
  }
  #player-section.active { display: flex; }

  #player-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: rgba(15,23,42,0.95);
    backdrop-filter: blur(10px);
  }
  #now-playing {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    margin-right: 10px;
  }
  #btn-close-player {
    background: var(--surface2);
    border: none;
    color: var(--text);
    width: 32px; height: 32px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
  }

  video {
    width: 100%;
    flex: 1;
    background: #000;
    object-fit: contain;
  }

  /* ── HEADER ── */
  .header {
    padding: 20px 16px 12px;
    text-align: center;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 800;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header p {
    font-size: 13px;
    color: var(--text2);
    margin-top: 4px;
  }

  /* ── SEARCH ── */
  .search-wrap {
    padding: 0 16px 12px;
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--bg);
  }
  #player-section.active ~ .search-wrap { position: relative; }

  #search {
    width: 100%;
    padding: 12px 16px 12px 42px;
    border-radius: 12px;
    border: 1px solid var(--surface2);
    background: var(--surface);
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color .2s;
  }
  #search:focus { border-color: var(--accent); }
  .search-wrap::before {
    content: "\1F50D";
    position: absolute;
    left: 30px;
    top: 12px;
    font-size: 16px;
    z-index: 1;
  }

  /* ── CATEGORIES ── */
  .categories {
    padding: 0 16px;
  }

  .cat-btn {
    display: flex;
    align-items: center;
    width: 100%;
    padding: 14px 16px;
    margin-bottom: 8px;
    background: var(--surface);
    border: 1px solid transparent;
    border-radius: var(--radius);
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    text-align: left;
  }
  .cat-btn:active { transform: scale(0.98); }
  .cat-btn.active {
    border-color: var(--accent);
    background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(139,92,246,0.1));
    box-shadow: 0 0 20px var(--accent-glow);
  }
  .cat-icon {
    font-size: 22px;
    margin-right: 12px;
    width: 30px;
    text-align: center;
  }
  .cat-count {
    margin-left: auto;
    background: var(--surface2);
    color: var(--text2);
    font-size: 12px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
  }
  .cat-btn.active .cat-count {
    background: var(--accent);
    color: #fff;
  }
  .cat-arrow {
    margin-left: 8px;
    font-size: 12px;
    color: var(--text2);
    transition: transform .3s;
  }
  .cat-btn.active .cat-arrow { transform: rotate(90deg); }

  /* ── CHANNEL LIST ── */
  .channel-list {
    max-height: 0;
    overflow: hidden;
    transition: max-height .4s ease;
    margin-bottom: 4px;
  }
  .channel-list.open {
    max-height: 5000px;
  }

  .channel {
    display: flex;
    align-items: center;
    padding: 12px 16px 12px 58px;
    cursor: pointer;
    border-radius: 10px;
    margin: 2px 16px;
    transition: background .15s;
  }
  .channel:active { background: var(--surface2); }
  .channel.playing {
    background: rgba(59,130,246,0.15);
  }

  .ch-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 12px;
    flex-shrink: 0;
    opacity: 0.5;
  }
  .channel.playing .ch-dot {
    opacity: 1;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 var(--accent-glow); }
    50% { box-shadow: 0 0 0 6px transparent; }
  }

  .ch-name {
    font-size: 14px;
    font-weight: 500;
    flex: 1;
  }
  .ch-play {
    font-size: 18px;
    opacity: 0.4;
  }
  .channel.playing .ch-play { opacity: 1; }

  /* ── LOADING ── */
  #loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    flex-direction: column;
    gap: 12px;
  }
  #loading-overlay.show { display: flex; }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--surface2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── ERROR TOAST ── */
  #toast {
    position: fixed;
    bottom: calc(20px + var(--safe-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #ef4444;
    color: #fff;
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    z-index: 300;
    transition: transform .3s;
    white-space: nowrap;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  /* ── FOOTER ── */
  .footer {
    text-align: center;
    padding: 30px 16px calc(20px + var(--safe-bottom));
    color: var(--text2);
    font-size: 12px;
  }

  /* ── BACK BUTTON (channel view) ── */
  #back-btn {
    display: none;
    align-items: center;
    gap: 6px;
    padding: 10px 16px;
    margin: 0 16px 8px;
    background: var(--surface);
    border: none;
    border-radius: var(--radius);
    color: var(--accent);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #back-btn:active { background: var(--surface2); }

  /* ── NO RESULTS ── */
  .no-results {
    text-align: center;
    padding: 40px 20px;
    color: var(--text2);
    font-size: 15px;
    display: none;
  }
</style>
</head>

// ── BUILD UI ──
const catOrder = [...new Set(channels.map(c => c.cat))];
const catMap = {};
channels.forEach(c => {
  if (!catMap[c.cat]) catMap[c.cat] = {icon: c.icon, channels: []};
  catMap[c.cat].channels.push(c);
});

document.getElementById('total-count').textContent = `${channels.length} cha\u00eenes \u2022 ${catOrder.length} cat\u00e9gories`;

const container = document.getElementById('categories');

catOrder.forEach(cat => {
  const data = catMap[cat];

  // Category button
  const btn = document.createElement('button');
  btn.className = 'cat-btn';
  btn.innerHTML = `
    <span class="cat-icon">${data.icon}</span>
    ${cat}
    <span class="cat-count">${data.channels.length}</span>
    <span class="cat-arrow">\u25B6</span>
  `;

  // Channel list
  const list = document.createElement('div');
  list.className = 'channel-list';

  data.channels.forEach((ch, i) => {
    const item = document.createElement('div');
    item.className = 'channel';
    item.dataset.url = ch.url;
    item.dataset.name = ch.name;
    item.innerHTML = `
      <span class="ch-dot"></span>
      <span class="ch-name">${ch.name}</span>
      <span class="ch-play">\u25B6</span>
    `;
    item.addEventListener('click', () => playChannel(ch.name, ch.url, item));
    list.appendChild(item);
  });

  btn.addEventListener('click', () => {
    const isOpen = list.classList.contains('open');
    // Close all
    document.querySelectorAll('.channel-list').forEach(l => l.classList.remove('open'));
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    if (!isOpen) {
      list.classList.add('open');
      btn.classList.add('active');
      setTimeout(() => btn.scrollIntoView({behavior:'smooth', block:'start'}), 100);
    }
  });

  container.appendChild(btn);
  container.appendChild(list);
});

// ── PLAYER ──
const video = document.getElementById('video');
const playerSection = document.getElementById('player-section');
const nowPlaying = document.getElementById('now-playing');
const loadingOverlay = document.getElementById('loading-overlay');
const toast = document.getElementById('toast');
let hls = null;
let currentItem = null;

function playChannel(name, url, item) {
  // Highlight
  if (currentItem) currentItem.classList.remove('playing');
  item.classList.add('playing');
  currentItem = item;

  nowPlaying.textContent = name;
  playerSection.classList.add('active');
  loadingOverlay.classList.add('show');

  // Cleanup previous
  if (hls) { hls.destroy(); hls = null; }
  video.src = '';

  // Check if URL is m3u8/HLS
  const isHLS = url.includes('.m3u8') || url.includes('.m3u');

  if (isHLS && Hls.isSupported()) {
    hls = new Hls({
      maxBufferLength: 30,
      maxMaxBufferLength: 60,
      startLevel: -1,
      capLevelToPlayerSize: true
    });
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      loadingOverlay.classList.remove('show');
      video.play().catch(() => {});
    });
    hls.on(Hls.Events.ERROR, (e, data) => {
      loadingOverlay.classList.remove('show');
      if (data.fatal) showToast('Flux indisponible ou g\u00e9obloqu\u00e9');
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    // Native HLS (Safari / iOS)
    video.src = url;
    video.addEventListener('loadedmetadata', () => {
      loadingOverlay.classList.remove('show');
      video.play().catch(() => {});
    }, {once: true});
    video.addEventListener('error', () => {
      loadingOverlay.classList.remove('show');
      showToast('Flux indisponible');
    }, {once: true});
  } else {
    loadingOverlay.classList.remove('show');
    showToast('Format non support\u00e9');
  }

  // Scroll to top to see player
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function closePlayer() {
  playerSection.classList.remove('active');
  if (hls) { hls.destroy(); hls = null; }
  video.pause();
  video.src = '';
  if (currentItem) { currentItem.classList.remove('playing'); currentItem = null; }
  nowPlaying.textContent = '---';
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

// ── SEARCH ──
const searchInput = document.getElementById('search');
const noResults = document.getElementById('no-results');

searchInput.addEventListener('input', () => {
  const q = searchInput.value.toLowerCase().trim();
  let found = 0;

  document.querySelectorAll('.cat-btn').forEach((btn, i) => {
    const list = btn.nextElementSibling;
    const items = list.querySelectorAll('.channel');
    let catVisible = 0;

    items.forEach(item => {
      const match = !q || item.dataset.name.toLowerCase().includes(q);
      item.style.display = match ? '' : 'none';
      if (match) catVisible++;
    });

    btn.style.display = (!q || catVisible > 0) ? '' : 'none';
    found += catVisible;

    // Auto-open matching categories when searching
    if (q && catVisible > 0) {
      list.classList.add('open');
      btn.classList.add('active');
    } else if (!q) {
      list.classList.remove('open');
      btn.classList.remove('active');
    }
  });

  noResults.style.display = (q && found === 0) ? 'block' : 'none';
});

// Timeout for loading
setTimeout(() => {
  if (loadingOverlay.classList.contains('show')) {
    loadingOverlay.classList.remove('show');
    showToast('Chargement trop long');
  }
}, 15000);
</script>
